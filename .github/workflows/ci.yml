# Unit tests and a production build for every live-fix pull request. No secrets, no deploys.
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: ["live-fix/**", "hotfix/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test:unit
      - run: bunx cf build
