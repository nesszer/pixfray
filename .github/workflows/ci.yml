# Unit tests and a production build for every live-fix pull request. No secrets, no deploys.
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: ["live-fix/**", "hotfix/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npx cf build
